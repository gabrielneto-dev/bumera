# Production services for the Bumera app and Evolution API, on the shared server infra.
# Lives in ~/bumera-app on the server (sources in ~/bumera-app/src); Postgres and n8n come from
# ~/infra and are reached over the external docker network "infra" (hosts: postgres, n8n).
#   cd ~/bumera-app && docker compose build app && docker compose --profile tools run --rm migrate && docker compose up -d app evolution redis
# Values come from ~/bumera-app/.env (names listed in deploy/env.production.example).
# Nothing is published on the network: Cloudflare Tunnel -> 127.0.0.1:3000, and
# n8n reaches the services as http://bumera-app:3000 and http://bumera-evolution:8080.
name: bumera-app

networks:
  infra:
    external: true
    name: infra

services:
  migrate:
    profiles: ["tools"]
    build:
      context: ./src
      # BuildKit's default resolver fails on this server; the host network resolves fine.
      network: host
      target: migrate
    environment:
      DATABASE_URL: postgresql://bumera:${POSTGRES_PASSWORD}@postgres:5432/bumera_prod
      # Only for scripts/ai-eval.ts --from-db, which decrypts the clinic's saved AI key in memory.
      CPF_ENCRYPTION_KEY: ${CPF_ENCRYPTION_KEY}
    mem_limit: 768m
    networks: [infra]

  app:
    build:
      context: ./src
      # BuildKit's default resolver fails on this server; the host network resolves fine.
      network: host
      target: runtime
    container_name: bumera-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://bumera:${POSTGRES_PASSWORD}@postgres:5432/bumera_prod
      BETTER_AUTH_URL: https://bumera.gnslab.com.br
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      CPF_ENCRYPTION_KEY: ${CPF_ENCRYPTION_KEY}
      CPF_HASH_KEY: ${CPF_HASH_KEY}
      SERVICE_API_KEY: ${SERVICE_API_KEY}
      EVOLUTION_WEBHOOK_TOKEN: ${EVOLUTION_WEBHOOK_TOKEN}
      # Read-only: shows each clinic's WhatsApp connection state on the WhatsApp screen.
      EVOLUTION_API_URL: http://bumera-evolution:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      # Module 4 (optional): without both of these the AI assistant does not exist and free text goes to the secretary.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 512m
    networks: [infra]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s

  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: bumera-evolution
    restart: unless-stopped
    environment:
      SERVER_URL: http://bumera-evolution:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: ${EVOLUTION_DATABASE_URI}
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://bumera-redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - bumera_evolution_instances:/evolution/instances
    mem_limit: 640m
    networks: [infra]
    depends_on:
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine
    container_name: bumera-redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    mem_limit: 96m
    networks: [infra]

volumes:
  bumera_evolution_instances:
